# Sized for this 8GB machine: -Xmx8G asked for more RAM than the whole box has,
# so the Gradle JVM crashed ("daemon disappeared"). 2G heap + 1G metaspace is
# plenty for a Flutter release bundle and leaves room for Windows and the rest.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# enableJetifier was removed in AGP 9 and is an error if left here. It
# rewrote old support-library bytecode to AndroidX; nothing in this app has
# needed that for years, and no plugin here still ships support-library
# classes.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
