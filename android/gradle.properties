# Sized for this 8GB machine: -Xmx8G asked for more RAM than the whole box has,
# so the Gradle JVM crashed ("daemon disappeared"). 2G heap + 1G metaspace is
# plenty for a Flutter release bundle and leaves room for Windows and the rest.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
