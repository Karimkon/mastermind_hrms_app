name: mastermind_hrms_app
description: "Mastermind Consult Ltd HRMS — mobile and desktop app"
publish_to: 'none'
version: 1.5.2+24
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # HTTP client
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.4
  flutter_secure_storage_windows: ^3.1.2

  # Local storage
  shared_preferences: ^2.3.0

  # Fonts
  google_fonts: ^6.2.0

  # Charts
  fl_chart: ^0.69.0

  # Date / time
  intl: ^0.19.0

  # File picker
  file_picker: ^8.1.0
  # Camera and gallery for profile photos. file_picker only browses files,
  # so "take a photo" was impossible in the app; image_picker also downscales
  # on the device, which keeps a 48MP photo off the wire entirely.
  image_picker: ^1.1.2

  # Geolocation (for geo-fence attendance)
  geolocator: ^13.0.0

  # Open files
  open_filex: ^4.3.0

  # Images
  cached_network_image: ^3.4.0

  # Loading states
  shimmer: ^3.0.0

  # Window management
  window_manager: ^0.4.0

  # SVG icons
  flutter_svg: ^2.0.0

  # Cupertino glyphs. Nothing in lib/ uses these directly, but Flutter's own
  # Material widgets fall back to them on iOS (the back button, adaptive
  # dialogs), and without the package those render as missing glyphs.
  cupertino_icons: ^1.0.8

  # Voice notes: recording them, and playing them back inline the way a
  # chat is expected to. Video and documents are handed to the system
  # player through open_filex instead, which is already here.
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Misc
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Pin the record plugin's platform interface: record_linux 0.7.2 (latest) does not
# implement interface 1.6.0's new members (startStream, hasPermission{request}), which
# breaks release AOT compilation. 1.5.0 predates them and satisfies every record_* package.
dependency_overrides:
  # record 5.2.1 pins record_linux <1.0.0 (0.7.2), which does not implement
  # interface 1.6.0 and breaks release AOT. 1.3.1 implements it; not used on Android.
  record_linux: 1.3.1
